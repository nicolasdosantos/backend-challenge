name: wagering

services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  sqs:
    image: ministackorg/ministack:1.5.24@sha256:92e9110653e4723b40dfe98a3d5ab0bff702580b05913ab39d9e8d87c72e48d2
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')\""]
      interval: 2s
      timeout: 3s
      retries: 30

  # Cria as filas (idempotente) assim que o emulador fica saudável.
  sqs-init:
    build: .
    command: ["bun", "run", "scripts/create-queues.ts"]
    environment:
      SQS_ENDPOINT: http://sqs:4566
    depends_on:
      sqs:
        condition: service_healthy

  # Executa a suíte em Linux (sinais POSIX reais). Uso: docker compose run --rm tests
  tests:
    build: .
    profiles: ["test"]
    command: ["bun", "test"]
    # Código montado do host (sem rebuild a cada mudança); node_modules continua o da imagem (Linux).
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering_test
      SQS_ENDPOINT: http://sqs:4566
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_healthy

volumes:
  postgres-data:
